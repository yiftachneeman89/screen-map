<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen Map</title>
  <meta name="description" content="See an Android app as a flow chart: every screen drawn from its XML layout, every button linked to the screen it opens.">
  <meta name="theme-color" content="#f4f3ef">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610112303">
</head>
<body>
  <header class="topbar">
    <a class="deck-back" href="/review-deck/" title="Back to Review Deck">&larr; Review Deck</a>
    <div class="brand">
      <img src="icons/logo.svg" alt="" class="brand-logo">
      <div>
        <h1>Screen Map</h1>
        <p class="brand-sub" id="projectName">Your Android app as a flow chart</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" hidden>
      <button class="tab-btn active" data-view="flow">Flow</button>
      <button class="tab-btn" data-view="gallery">All layouts</button>
    </nav>
    <div class="top-actions" id="topActions" hidden>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 4.4 12.4l4.3 4.3 1.4-1.4-4.3-4.3A7 7 0 0 0 11 4Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
        <input id="search" type="search" placeholder="Find a screen" autocomplete="off">
      </label>
    </div>
  </header>

  <main id="main">
    <section class="landing" id="landing" hidden>
      <div class="landing-copy">
        <h2>Couldn't open your project</h2>
        <p class="error" id="loadError"></p>
        <p><a href="/review-deck/">Back to Review Deck</a> to choose your code again.</p>
      </div>
    </section>

    <section class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">Loading your project…</p>
    </section>

    <section class="flow-view" id="flowView" hidden>
      <div class="canvas" id="canvas"></div>
      <div class="legend">
        <span><i class="lg-solid"></i>Tap opens</span>
        <span><i class="lg-dash"></i>Automatic</span>
        <label class="lg-toggle" id="sharedToggle" hidden><input type="checkbox" id="sharedCheck"> Bottom-bar arrows</label>
        <span class="lg-hint">Click a screen to see it</span>
      </div>
      <div class="zoom-ctl">
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomPct">100%</span>
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="fitBtn" title="Fit everything">Fit</button>
        <button id="resetBtn" title="Put every box back in its automatic place" hidden>Reset layout</button>
      </div>
    </section>

    <section class="gallery-view" id="galleryView" hidden>
      <div class="gallery" id="gallery"></div>
    </section>

    <div class="uml-bar" id="umlBar" hidden>
      <button class="uml-btn" id="umlBtn" title="Download a UML class diagram of your code as a PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        <span>Download UML diagram (PDF)</span>
      </button>
      <button class="uml-src" id="umlSrc" title="The same diagram as an editable PlantUML file">.puml</button>
    </div>

    <div class="viewer" id="viewer" hidden>
      <div class="viewer-card" id="viewerCard" role="dialog" aria-modal="true">
        <div class="viewer-bar">
          <button class="viewer-back" id="viewerBack" hidden>← Back to <span></span></button>
          <button class="viewer-close" id="viewerClose" aria-label="Close">✕</button>
        </div>
        <div class="viewer-body" id="viewerBody"></div>
      </div>
    </div>
  </main>

  <script src="js/ingest.js?v=202610112321"></script>
  <script src="js/resources.js?v=202610112321"></script>
  <script src="js/analyze.js?v=202610112321"></script>
  <script src="js/render.js?v=202610112321"></script>
  <script src="js/layout.js?v=202610112321"></script>
  <script src="js/graph.js?v=202610112321"></script>
  <script src="js/uml.js?v=202610112321"></script>
  <script src="/review-deck/shared.js?v=4"></script>
  <script src="js/app.js?v=202610112321"></script>
</body>
</html>
